name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitframe
          POSTGRES_PASSWORD: kitframe
          POSTGRES_DB: kitframe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kitframe -d kitframe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check kitframe
      - name: Mypy
        run: mypy kitframe || true
      - name: Migrate
        env:
          DATABASE_URL: postgresql+asyncpg://kitframe:kitframe@localhost:5432/kitframe
          JWT_SECRET: local-dev-jwt-secret-change-me-now!!
          APP_ENV: test
          IMAGE_PROVIDER: fake
          LLM_PROVIDER: fake
        run: alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://kitframe:kitframe@localhost:5432/kitframe
          JWT_SECRET: local-dev-jwt-secret-change-me-now!!
          APP_ENV: test
          IMAGE_PROVIDER: fake
          LLM_PROVIDER: fake
        run: pytest -q --cov=kitframe/workflow --cov=kitframe/auth --cov=kitframe/qc --cov=kitframe/studio --cov=kitframe/shopify
      - name: pip-audit
        run: pip install pip-audit && pip-audit || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      - run: npm audit --audit-level=high || true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
