name: images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra tag (in addition to git SHA)
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/Dockerfile.api
            image_suffix: kitframe-api
          - name: web
            dockerfile: infra/docker/Dockerfile.web
            image_suffix: kitframe-web
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${{ env.REGISTRY }}/${OWNER}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
            echo "${{ steps.meta.outputs.image }}:latest"
            if [[ -n "${{ inputs.tag }}" ]]; then
              echo "${{ steps.meta.outputs.image }}:${{ inputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Same-origin via Caddy; override with repo variable if needed.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
