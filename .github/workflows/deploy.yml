name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Container image tag (git SHA from images workflow)
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-approval:
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval gate
        run: echo "Approved production deploy for tag ${{ inputs.image_tag }}"

  deploy:
    needs:
      - production-approval
    if: always() && (needs.production-approval.result == 'success' || inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          KITFRAME_HOME: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOME_DIR="${KITFRAME_HOME:-/opt/kitframe}"
          ssh -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd '${HOME_DIR}'
             git fetch --all --tags
             git checkout '${IMAGE_TAG}' 2>/dev/null || git checkout '${{ github.sha }}' 2>/dev/null || git pull --ff-only
             export IMAGE_TAG='${IMAGE_TAG}'
             ./scripts/deploy.sh
            "

      - name: Smoke check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_URL}" ]]; then
            echo "Set environment variable APP_URL (e.g. https://kitframe.example.com) for smoke checks."
            exit 0
          fi
          curl -fsS "${APP_URL}/api/v1/healthz"
          curl -fsS -o /dev/null -w "%{http_code}\n" "${APP_URL}/" | grep -E '200|301|302|308'
          echo "Smoke OK"
