name: Deploy Hetzner

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: hetzner-deploy-kitframe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Check GitHub Actions secrets
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ secrets.HETZNER_HOST }}" ] && missing+=("HETZNER_HOST")
          [ -z "${{ secrets.HETZNER_USER }}" ] && missing+=("HETZNER_USER")
          [ -z "${{ secrets.HETZNER_SSH_KEY }}" ] && missing+=("HETZNER_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltan secrets de deploy: ${missing[*]}"
            echo "Settings → Environments → production → Environment secrets"
            exit 1
          fi

      - name: Require CI green for commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="${{ github.sha }}"
          ok="$(gh run list --repo "${{ github.repository }}" --workflow ci --commit "$REF" --status completed --json conclusion --jq '[.[] | select(.conclusion=="success")] | length')"
          if [[ "${ok:-0}" -lt 1 ]]; then
            echo "::error::No hay una ejecución exitosa de CI para $REF."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.HETZNER_DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/kitframe}"
            REF="${{ github.event.workflow_run.head_sha || github.sha }}"
            cd "$DEPLOY_PATH"
            git fetch origin
            if git rev-parse HEAD >/dev/null 2>&1; then
              git rev-parse HEAD > .deploy-previous-sha
            fi
            echo "$REF" > .deploy-target-sha
            git reset --hard "$REF"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
