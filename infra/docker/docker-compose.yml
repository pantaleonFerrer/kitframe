services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kitframe
      POSTGRES_PASSWORD: kitframe
      POSTGRES_DB: kitframe
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitframe -d kitframe"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kitframe
      MINIO_ROOT_PASSWORD: kitframekitframe
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 kitframe kitframekitframe;
      mc mb -p local/kitframe-assets || true;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["kitframe", "api", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://kitframe:kitframe@postgres:5432/kitframe
      JWT_SECRET: local-dev-jwt-secret-change-me-now!!
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      IMAGE_PROVIDER: fake
      LLM_PROVIDER: fake
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: kitframe
      S3_SECRET_ACCESS_KEY: kitframekitframe
      S3_BUCKET: kitframe-assets
      S3_USE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CORS_ORIGINS: http://localhost:3000
      SEED_PASSWORDS: "true"
      METRICS_TOKEN: local-metrics-token
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["kitframe", "worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://kitframe:kitframe@postgres:5432/kitframe
      JWT_SECRET: local-dev-jwt-secret-change-me-now!!
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      IMAGE_PROVIDER: fake
      LLM_PROVIDER: fake
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: kitframe
      S3_SECRET_ACCESS_KEY: kitframekitframe
      S3_BUCKET: kitframe-assets
      S3_USE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SEED_PASSWORDS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      API_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
