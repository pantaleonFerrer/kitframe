# Production stack for Hetzner — coexists with gathered-brain on the same VPS.
# Host Nginx owns :80/:443 (see infra/nginx/kitframe.conf).
# Postgres is external (same as gathered-brain) — set DATABASE_URL in .env.
#
# Usage (from /opt/kitframe):
#   ./scripts/deploy.sh

name: kitframe

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
  APP_BASE_URL: ${APP_BASE_URL:-https://${DOMAIN}}
  API_BASE_URL: ${API_BASE_URL:-https://${DOMAIN}}
  SEED_PASSWORDS: ${SEED_PASSWORDS:-false}

services:
  api:
    build:
      # Paths relative to --project-directory (repo root), see scripts/deploy.sh
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ["kitframe", "api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # Avoid host :8080 (gathered-brain core-api)
      - "127.0.0.1:${KITFRAME_API_HOST_PORT:-18080}:8080"
    env_file:
      - .env
    environment:
      <<: *app-env
    extra_hosts:
      # Reach Postgres on the host (if DATABASE_URL uses host.docker.internal)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kitframe

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ["kitframe", "worker"]
    env_file:
      - .env
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kitframe

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KITFRAME_WEB_HOST_PORT:-13000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      API_URL: ${API_URL:-http://api:8080/api/v1}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kitframe

networks:
  kitframe:
    name: kitframe
