# 1) Copiar a sites-available y habilitar (solo HTTP al principio).
# 2) sudo nginx -t && sudo systemctl reload nginx
# 3) sudo certbot --nginx -d kitframe.gathered.so
#    Certbot añade el bloque 443 + ssl_certificate (como en api.gathered.so).
#
# Upstream: web :13000, api :18080 (no usar :8080 — es gathered core-api).

upstream kitframe_web {
    server 127.0.0.1:13000;
}

upstream kitframe_api {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    listen [::]:80;
    server_name kitframe.gathered.so;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://kitframe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://kitframe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
