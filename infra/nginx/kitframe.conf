# Install on the Hetzner host (same Nginx that fronts gathered-brain):
#   sudo cp infra/nginx/kitframe.conf /etc/nginx/sites-available/kitframe
#   # set server_name + cert paths, then:
#   sudo ln -sf /etc/nginx/sites-available/kitframe /etc/nginx/sites-enabled/kitframe
#   sudo certbot --nginx -d kitframe.example.com   # or reuse existing certs
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ports match docker-compose.prod.yml defaults (loopback only).

upstream kitframe_web {
    server 127.0.0.1:13000;
}

upstream kitframe_api {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    listen [::]:80;
    server_name kitframe.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kitframe.example.com;

    # ssl_certificate     /etc/letsencrypt/live/kitframe.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kitframe.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://kitframe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://kitframe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
